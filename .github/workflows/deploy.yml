name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact SemVer tag to release
        required: true
        type: string
  push:
    branches:
      - master
    # The release job changes only this file.  Do not build another :master
    # snapshot for that manifest-only commit.
    paths-ignore:
      - kubernetes/kustomization.yaml
    tags:
      - "v*"

env:
  DOCKER_IMAGE_NAME: akatukisora/pjserver-sys

jobs:
  validate-release:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and master ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"

          # SemVer 2.0.0, with an optional prerelease. Build metadata is not
          # accepted because Docker tags cannot contain '+'.
          if ! node -e '
            const tag = process.argv[1];
            const semver = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?$/;
            process.exit(semver.test(tag) ? 0 : 1);
          ' "$tag"; then
            echo "Release tags must be vX.Y.Z or vX.Y.Z-prerelease (SemVer 2.0.0): $tag" >&2
            exit 1
          fi

          git fetch --no-tags origin master
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "Refusing release: $tag does not point to a commit reachable from master." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-image:
    name: Build and attest release image
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.tag }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push exact release image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Generate and attest provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.DOCKER_IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}

  update-production-manifest:
    name: Update production manifest
    needs:
      - validate-release
      - release-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize only the write to master: a newer release must not be lost to
    # a concurrent manifest commit.
    concurrency:
      group: production-manifest-master
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refuse automatic release downgrade
        id: release-order
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          current_tag="$(sed -n -E 's/^[[:space:]]*newTag:[[:space:]]*([^[:space:]#]+).*/\1/p' kubernetes/kustomization.yaml)"
          if [[ -z "$current_tag" ]]; then
            echo 'kubernetes/kustomization.yaml has no images.newTag.' >&2
            exit 1
          fi

          # v0.0 is the pre-release-automation placeholder and may be
          # promoted once. All later automated promotions must be monotonic.
          if [[ "$current_tag" == 'v0.0' ]]; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result="$(node - "$current_tag" "$RELEASE_TAG" <<'NODE'
          const [current, release] = process.argv.slice(2);
          const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*))?$/;
          const parse = (tag) => {
            const match = tag.match(semver);
            if (!match) throw new Error(`not an exact release tag: ${tag}`);
            return { core: match.slice(1, 4).map(Number), pre: match[4]?.split('.') };
          };
          const compare = (left, right) => {
            for (let i = 0; i < 3; i += 1) {
              if (left.core[i] !== right.core[i]) return left.core[i] < right.core[i] ? -1 : 1;
            }
            if (!left.pre && !right.pre) return 0;
            if (!left.pre) return 1;
            if (!right.pre) return -1;
            const length = Math.max(left.pre.length, right.pre.length);
            for (let i = 0; i < length; i += 1) {
              if (left.pre[i] === undefined) return -1;
              if (right.pre[i] === undefined) return 1;
              const leftNumeric = /^(0|[1-9]\d*)$/.test(left.pre[i]);
              const rightNumeric = /^(0|[1-9]\d*)$/.test(right.pre[i]);
              if (leftNumeric && rightNumeric) {
                const delta = BigInt(left.pre[i]) - BigInt(right.pre[i]);
                if (delta !== 0n) return delta < 0n ? -1 : 1;
              } else if (leftNumeric !== rightNumeric) {
                return leftNumeric ? -1 : 1;
              } else if (left.pre[i] !== right.pre[i]) {
                return left.pre[i] < right.pre[i] ? -1 : 1;
              }
            }
            return 0;
          };
          console.log(compare(parse(release), parse(current)));
          NODE
          )"
          case "$result" in
            1) echo 'update=true' >> "$GITHUB_OUTPUT" ;;
            0)
              echo "Production manifest already points to ${RELEASE_TAG}."
              echo 'update=false' >> "$GITHUB_OUTPUT"
              ;;
            -1)
              echo "Refusing automatic downgrade from ${current_tag} to ${RELEASE_TAG}. Use a manual manifest commit for rollback." >&2
              exit 1
              ;;
            *)
              echo "Unexpected SemVer comparison result: ${result}" >&2
              exit 1
              ;;
          esac

      - name: Set production image tag
        if: steps.release-order.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i -E "s|^([[:space:]]*newTag:).*|\\1 ${RELEASE_TAG}|" kubernetes/kustomization.yaml
          kubectl kustomize kubernetes > /tmp/pjserver-sys-manifest.yaml
          grep -F "image: ${DOCKER_IMAGE_NAME}:${RELEASE_TAG}" /tmp/pjserver-sys-manifest.yaml

      - name: Create, validate, and merge promotion PR
        if: steps.release-order.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/promotion-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          existing="$(gh pr list --base master --state open --search "in:title release ${RELEASE_TAG}" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Promotion PR #${existing} already exists; refusing duplicate release until it is resolved." >&2
            exit 1
          fi
          git switch -c "$branch"
          git add kubernetes/kustomization.yaml
          git commit -m "chore(deploy): release ${RELEASE_TAG}"
          git push origin "HEAD:refs/heads/${branch}"
          pr_url="$(gh pr create --base master --head "$branch" --title "chore(deploy): release ${RELEASE_TAG}" --body "Automated manifest-only promotion for ${RELEASE_TAG}.")"
          gh workflow run ci.yml --ref "$branch" -f ref="$branch"
          for _ in {1..30}; do
            run_id="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId,headSha --jq '.[] | select(.headSha != null) | .databaseId' | head -1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "${run_id:-}" ]] || { echo 'Timed out waiting for promotion CI to start.' >&2; exit 1; }
          gh run watch "$run_id" --exit-status
          gh pr checks "$pr_url" --watch --fail-fast
          gh pr merge "$pr_url" --merge --delete-branch
          merged="$(gh pr view "$pr_url" --json state,mergeCommit --jq 'if .state == "MERGED" and .mergeCommit != null then .mergeCommit.oid else empty end')"
          [[ -n "$merged" ]] || { echo 'Promotion PR did not reach MERGED state.' >&2; exit 1; }

  snapshot-image:
    name: Build and push master snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=master

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push master snapshot
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Generate and attest provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.DOCKER_IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
